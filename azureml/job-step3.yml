$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: picotron-step3-baseline_1B
experiment_name: picotron-scaling
description: >-
  step3_dataloader with your full command, 2 GPUs via torchrun.
  --dp_size 2 is added because process_group_manager asserts
  world_size == dp*pp*tp, and the defaults (1*1*1) would abort under
  --nproc_per_node 2. Caveat: step3 has no gradient all-reduce and its
  dataloader does not shard by dp_rank, so both ranks train on identical
  batches. Use step5/step6 for a real data-parallel baseline.

code: ../step3_dataloader

command: >-
  torchrun --nproc_per_node 2 train.py
  --micro_batch_size 4
  --gradient_accumulation_steps 8
  --seq_len 1024
  --max_tokens 4096000
  --num_proc 16
  --model_name TinyLlama/TinyLlama_v1.1
  --num_hidden_layers 22
  --num_attention_heads 32
  --num_key_value_heads 4
  --dp_size 2
  --run_name baseline_1B
  --use_wandb

environment:
  name: picotron-flashattn
  build:
    path: .
    dockerfile_path: Dockerfile

compute: azureml:ScalingExp

resources:
  instance_count: 1

environment_variables:
  # Required for --use_wandb. Inject at submit time (see submit.sh) rather than
  # committing a key here.
  WANDB_API_KEY: ""
  WANDB_PROJECT: picotron_tutorial
  # Dataset/tokenizer cache. Node-local; a fresh node re-downloads TinyStories.
  HF_HOME: /tmp/hf
  HF_DATASETS_CACHE: /tmp/hf/datasets
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  NCCL_DEBUG: WARN
