$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: picotron-step6-baseline_1B
experiment_name: picotron-scaling
description: >-
  step6_data_parallel_bucket: same as step5 but DataParallelBucket overlaps the
  gradient all-reduce with the backward pass in buckets. Identical math to
  step5, so a step5-vs-step6 pair isolates the bucketing speedup at fixed loss.
  --dp_size 2 is required: process_group_manager asserts world_size == dp*pp*tp.

code: ../step6_data_parallel_bucket

command: >-
  torchrun --nproc_per_node 2 train.py
  --micro_batch_size 4
  --gradient_accumulation_steps 8
  --seq_len 1024
  --max_tokens 4096000
  --num_proc 16
  --model_name TinyLlama/TinyLlama_v1.1
  --num_hidden_layers 22
  --num_attention_heads 32
  --num_key_value_heads 4
  --dp_size 2
  --run_name baseline_1B
  --use_wandb

environment:
  name: picotron-flashattn
  build:
    path: .
    dockerfile_path: Dockerfile

compute: azureml:ScalingExp

resources:
  instance_count: 1

environment_variables:
  # Required for --use_wandb. Injected at submit time by submit.sh.
  WANDB_API_KEY: ""
  WANDB_PROJECT: picotron_tutorial
  HF_HOME: /tmp/hf
  HF_DATASETS_CACHE: /tmp/hf/datasets
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "1"
  NCCL_DEBUG: WARN
